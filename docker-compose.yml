name: upwork-agent

services:
  upwork-agent:
    build: .
    container_name: upwork-agent
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/agent.db
      HEALTH_PORT: "8000"
    volumes:
      - ./data:/app/data
    # No published ports: Telegram long-polling and Upwork/Groq calls are all
    # outbound. The health port stays inside the container.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
